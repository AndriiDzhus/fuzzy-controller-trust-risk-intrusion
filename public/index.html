<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="index.pageTitle">Індекс довіри | Платформа нечіткого виводу</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#667eea" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="navigation.css" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="app-header-top">
          <h1 class="app-brand-name" data-i18n="index.headline">Платформа нечіткого виводу для оцінки індексу довіри системи</h1>
          <div class="lang-wrap">
            <select id="languageSwitcher" class="lang-select">
              <option value="uk" data-i18n="common.languages.uk"></option>
              <option value="en" data-i18n="common.languages.en"></option>
            </select>
          </div>
        </div>
        <nav class="navigation" aria-label="controllers">
          <ul class="nav-list">
            <li><a class="nav-link active" href="index.html" data-i18n="navigation.main"></a></li>
            <li><a class="nav-link" href="security.html" data-i18n="navigation.security"></a></li>
            <li><a class="nav-link" href="intrusion.html" data-i18n="navigation.intrusion"></a></li>
          </ul>
        </nav>
        <div class="page-head">
          <div class="page-head-copy">
            <p class="description" data-i18n="index.description"></p>
          </div>
          <div class="page-head-tools">
            <div class="controller-meta">
              <span class="controller-meta-chip">
                <strong data-i18n="common.meta.model"></strong>
                <span data-i18n="common.meta.mamdani"></span>
              </span>
              <span class="controller-meta-chip">
                <strong data-i18n="common.meta.defuzzification"></strong>
                <span data-i18n="common.meta.centerOfGravity"></span>
              </span>
            </div>
            <div class="docs-actions">
              <button type="button" class="docs-btn" data-docs="formulas" data-i18n="common.docs.formulasBtn"></button>
              <button type="button" class="docs-btn docs-btn-alt" data-docs="rules" data-i18n="common.docs.rulesBtn"></button>
            </div>
          </div>
        </div>
      </header>

      <div class="workspace">
        <div class="input-section">
          <h2 class="workspace-heading" data-i18n="common.pipeline.inputs"></h2>
          <div class="input-group">
            <label for="errorsSlider" data-i18n="index.inputs.errors"></label>
            <input type="range" id="errorsSlider" min="0" max="100" step="0.1" value="50" />
            <input type="number" id="errors" min="0" max="100" step="0.1" value="50" />
            <span class="input-value" id="eValue">50.0</span>
          </div>

          <div class="input-group">
            <label for="connectionsSlider" data-i18n="index.inputs.connections"></label>
            <input type="range" id="connectionsSlider" min="0" max="100" step="0.1" value="50" />
            <input type="number" id="connections" min="0" max="100" step="0.1" value="50" />
            <span class="input-value" id="cValue">50.0</span>
          </div>

          <div class="input-group">
            <label for="bytesSlider" data-i18n="index.inputs.bytes"></label>
            <input type="range" id="bytesSlider" min="0" max="100" step="0.1" value="50" />
            <input type="number" id="bytes" min="0" max="100" step="0.1" value="50" />
            <span class="input-value" id="bValue">50.0</span>
          </div>
        </div>

        <div class="output-section">
          <h2 class="workspace-heading" data-i18n="index.results.title"></h2>
          <div class="result-display">
            <div class="result-item">
              <span class="result-label" data-i18n="index.results.value"></span>
              <span class="result-value" id="trustIndexOutput">--</span>
            </div>
            <div class="result-item">
              <span class="result-label" data-i18n="index.results.level"></span>
              <span class="result-term" id="activeOutputTerm">--</span>
              <small class="result-explanation" data-i18n="index.results.explanation"></small>
            </div>
          </div>
        </div>
      </div>

      <details class="process-step" data-step="fuzzification" open>
        <summary>
          <span class="process-step-num">1</span>
          <span class="process-step-title" data-i18n="common.pipeline.fuzzification"></span>
        </summary>
        <div class="process-step-body">
          <p class="process-step-hint" data-i18n="common.pipeline.fuzzificationHint"></p>
          <div class="graph-grid graph-grid-3">
            <div class="graph-container">
              <h4 data-i18n="index.membership.errors"></h4>
              <canvas id="errorsCanvas" width="400" height="220"></canvas>
              <div id="eTooltip" class="graph-tooltip"></div>
              <div id="eMembership" class="membership-values"></div>
            </div>
            <div class="graph-container">
              <h4 data-i18n="index.membership.connections"></h4>
              <canvas id="connectionsCanvas" width="400" height="220"></canvas>
              <div id="cTooltip" class="graph-tooltip"></div>
              <div id="cMembership" class="membership-values"></div>
            </div>
            <div class="graph-container">
              <h4 data-i18n="index.membership.bytes"></h4>
              <canvas id="bytesCanvas" width="400" height="220"></canvas>
              <div id="bTooltip" class="graph-tooltip"></div>
              <div id="bMembership" class="membership-values"></div>
            </div>
          </div>
        </div>
      </details>

      <details class="process-step" data-step="output" open>
        <summary>
          <span class="process-step-num">2</span>
          <span class="process-step-title" data-i18n="common.pipeline.output"></span>
        </summary>
        <div class="process-step-body">
          <div class="output-step-toolbar">
            <p class="process-step-hint" data-i18n="common.pipeline.outputHintMamdani"></p>
            <div class="graph-layer-toggles" data-output-layers>
              <label class="layer-toggle">
                <input type="checkbox" data-layer="accumulation" checked />
                <span data-i18n="common.pipeline.accumulation"></span>
              </label>
              <label class="layer-toggle">
                <input type="checkbox" data-layer="defuzzification" checked />
                <span data-i18n="common.pipeline.defuzzification"></span>
              </label>
            </div>
          </div>
          <div class="graph-grid graph-grid-split">
            <div class="graph-container">
              <h4 data-i18n="index.membership.trust"></h4>
              <canvas id="trustAggregatedCanvas" width="800" height="220"></canvas>
            </div>
            <div class="membership-section">
              <h4 data-i18n="index.membership.trust"></h4>
              <div id="tMembership" class="membership-values"></div>
            </div>
          </div>
        </div>
      </details>

    </div>

    <script src="i18n-helper.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="controller-docs.js"></script>
    <script src="fuzzy-page-core.js"></script>
    <script src="script.js"></script>
  </body>
</html>
