<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="index.pageTitle"></title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="navigation.css" />
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <nav class="navigation">
          <ul class="nav-list">
            <li><a class="nav-link active" href="index.html" data-i18n="navigation.main"></a></li>
            <li><a class="nav-link" href="security.html" data-i18n="navigation.security"></a></li>
            <li><a class="nav-link" href="intrusion.html" data-i18n="navigation.intrusion"></a></li>
          </ul>
        </nav>
        <div class="lang-wrap">
          <select id="languageSwitcher" class="lang-select">
            <option value="uk" data-i18n="common.languages.uk"></option>
            <option value="en" data-i18n="common.languages.en"></option>
          </select>
        </div>
      </div>

      <h1 data-i18n="index.title"></h1>
      <p class="description" data-i18n="index.description"></p>

      <div class="input-section">
        <div class="input-group">
          <label for="errorsSlider" data-i18n="index.inputs.errors"></label>
          <input type="range" id="errorsSlider" min="0" max="100" step="0.1" value="50" />
          <input type="number" id="errors" min="0" max="100" step="0.1" value="50" />
          <span class="input-value" id="eValue">50.0</span>
        </div>

        <div class="input-group">
          <label for="connectionsSlider" data-i18n="index.inputs.connections"></label>
          <input type="range" id="connectionsSlider" min="0" max="100" step="0.1" value="50" />
          <input type="number" id="connections" min="0" max="100" step="0.1" value="50" />
          <span class="input-value" id="cValue">50.0</span>
        </div>

        <div class="input-group">
          <label for="bytesSlider" data-i18n="index.inputs.bytes"></label>
          <input type="range" id="bytesSlider" min="0" max="100" step="0.1" value="50" />
          <input type="number" id="bytes" min="0" max="100" step="0.1" value="50" />
          <span class="input-value" id="bValue">50.0</span>
        </div>

        <button id="calculateBtn" data-i18n="index.buttons.calculate"></button>
      </div>

      <div class="output-section">
        <h2 data-i18n="index.results.title"></h2>
        <div class="result-display">
          <div class="result-item">
            <span class="result-label" data-i18n="index.results.value"></span>
            <span class="result-value" id="trustIndexOutput">--</span>
          </div>
          <div class="result-item">
            <span class="result-label" data-i18n="index.results.level"></span>
            <span class="result-term" id="activeOutputTerm">--</span>
            <small class="result-explanation" data-i18n="index.results.explanation"></small>
          </div>
        </div>
      </div>

      <div class="membership-display">
        <h3 data-i18n="index.membership.title"></h3>
        <div class="membership-grid">
          <div class="membership-section">
            <h4 data-i18n="index.membership.errors"></h4>
            <div id="eMembership" class="membership-values"></div>
          </div>
          <div class="membership-section">
            <h4 data-i18n="index.membership.connections"></h4>
            <div id="cMembership" class="membership-values"></div>
          </div>
          <div class="membership-section">
            <h4 data-i18n="index.membership.bytes"></h4>
            <div id="bMembership" class="membership-values"></div>
          </div>
          <div class="membership-section">
            <h4 data-i18n="index.membership.trust"></h4>
            <div id="tMembership" class="membership-values"></div>
          </div>
        </div>
      </div>

      <div class="graphs-section">
        <h3 data-i18n="index.graphs.title"></h3>
        <div class="graph-row">
          <div class="graph-container">
            <h4 data-i18n="index.membership.errors"></h4>
            <canvas
              id="errorsCanvas"
              width="400"
              height="250"
            ></canvas>
            <div id="eTooltip" class="graph-tooltip"></div>
          </div>
          <div class="graph-container">
            <h4 data-i18n="index.membership.connections"></h4>
            <canvas id="connectionsCanvas" width="400" height="250"></canvas>
            <div id="cTooltip" class="graph-tooltip"></div>
          </div>
        </div>
        <div class="graph-row">
          <div class="graph-container">
            <h4 data-i18n="index.membership.bytes"></h4>
            <canvas
              id="bytesCanvas"
              width="400"
              height="250"
            ></canvas>
            <div id="bTooltip" class="graph-tooltip"></div>
          </div>
          <div class="graph-container">
            <h4 data-i18n="index.membership.trust"></h4>
            <canvas id="trustIndexCanvas" width="400" height="250"></canvas>
            <div id="tTooltip" class="graph-tooltip"></div>
          </div>
        </div>
      </div>

      <div class="rules-section">
        <h3 data-i18n="index.rules.title"></h3>
        <p data-i18n="index.rules.description"></p>
        <div class="rules-summary">
          <div class="rule-category" data-i18n="index.rules.category1"></div>
          <div class="rule-category" data-i18n="index.rules.category2"></div>
          <div class="rule-category" data-i18n="index.rules.category3"></div>
        </div>
      </div>
    </div>

    <script src="i18n-helper.js"></script>
    <script src="fuzzy-page-core.js"></script>
    <script src="script.js"></script>
  </body>
</html>
