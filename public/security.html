<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="security.pageTitle">Ризик безпеки | Платформа нечіткого виводу</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#667eea" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="navigation.css" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="app-header-top">
          <h1 class="app-brand-name" data-i18n="security.headline">Платформа нечіткого виводу для оцінки безпеки систем</h1>
          <div class="lang-wrap">
            <select id="languageSwitcher" class="lang-select">
              <option value="uk" data-i18n="common.languages.uk"></option>
              <option value="en" data-i18n="common.languages.en"></option>
            </select>
          </div>
        </div>
        <nav class="navigation" aria-label="controllers">
          <ul class="nav-list">
            <li><a class="nav-link" href="index.html" data-i18n="navigation.main"></a></li>
            <li><a class="nav-link active" href="security.html" data-i18n="navigation.security"></a></li>
            <li><a class="nav-link" href="intrusion.html" data-i18n="navigation.intrusion"></a></li>
          </ul>
        </nav>
        <div class="page-head">
          <div class="page-head-copy">
            <p class="description" data-i18n="security.description"></p>
          </div>
          <div class="page-head-tools">
            <div class="controller-meta">
              <span class="controller-meta-chip">
                <strong data-i18n="common.meta.model"></strong>
                <span data-i18n="common.meta.sugeno"></span>
              </span>
              <span class="controller-meta-chip">
                <strong data-i18n="common.meta.defuzzification"></strong>
                <span data-i18n="common.meta.weightedAverage"></span>
              </span>
            </div>
            <div class="docs-actions">
              <button type="button" class="docs-btn" data-docs="formulas" data-i18n="common.docs.formulasBtn"></button>
              <button type="button" class="docs-btn docs-btn-alt" data-docs="rules" data-i18n="common.docs.rulesBtn"></button>
            </div>
          </div>
        </div>
      </header>

      <div class="workspace">
        <div class="input-section">
          <h2 class="workspace-heading" data-i18n="common.pipeline.inputs"></h2>
          <div class="input-group">
            <label for="energySlider" data-i18n="security.inputs.energy"></label>
            <input type="range" id="energySlider" min="0" max="100" step="0.1" value="50" />
            <input type="number" id="energyNumber" min="0" max="100" step="0.1" value="50" />
            <span class="input-value" id="energyValue">50.0</span>
          </div>
          <div class="input-group">
            <label for="strengthSlider" data-i18n="security.inputs.strength"></label>
            <input type="range" id="strengthSlider" min="0" max="100" step="0.1" value="50" />
            <input type="number" id="strengthNumber" min="0" max="100" step="0.1" value="50" />
            <span class="input-value" id="strengthValue">50.0</span>
          </div>
          <div class="input-group">
            <label for="responseSlider" data-i18n="security.inputs.response"></label>
            <input type="range" id="responseSlider" min="0" max="100" step="0.1" value="50" />
            <input type="number" id="responseNumber" min="0" max="100" step="0.1" value="50" />
            <span class="input-value" id="responseValue">50.0</span>
          </div>
        </div>

        <div class="output-section">
          <h2 class="workspace-heading" data-i18n="security.results.title"></h2>
          <div class="result-display">
            <div class="result-item">
              <span class="result-label" data-i18n="security.results.value"></span>
              <span class="result-value" id="riskValue">--</span>
            </div>
            <div class="result-item">
              <span class="result-label" data-i18n="security.results.level"></span>
              <span class="result-term" id="riskTerm">--</span>
            </div>
          </div>
        </div>
      </div>

      <details class="process-step" data-step="fuzzification" open>
        <summary>
          <span class="process-step-num">1</span>
          <span class="process-step-title" data-i18n="common.pipeline.fuzzification"></span>
        </summary>
        <div class="process-step-body">
          <p class="process-step-hint" data-i18n="common.pipeline.fuzzificationHint"></p>
          <div class="graph-grid graph-grid-3">
            <div class="graph-container">
              <h4 data-i18n="security.membership.energy"></h4>
              <canvas id="energyCanvas" width="400" height="220"></canvas>
              <div id="energyMembership" class="membership-values"></div>
            </div>
            <div class="graph-container">
              <h4 data-i18n="security.membership.strength"></h4>
              <canvas id="strengthCanvas" width="400" height="220"></canvas>
              <div id="strengthMembership" class="membership-values"></div>
            </div>
            <div class="graph-container">
              <h4 data-i18n="security.membership.response"></h4>
              <canvas id="responseCanvas" width="400" height="220"></canvas>
              <div id="responseMembership" class="membership-values"></div>
            </div>
          </div>
        </div>
      </details>

      <details class="process-step" data-step="rules" open>
        <summary>
          <span class="process-step-num">2</span>
          <span class="process-step-title" data-i18n="common.pipeline.rules"></span>
        </summary>
        <div class="process-step-body">
          <p class="process-step-hint" data-i18n="common.pipeline.rulesHintSugeno"></p>
          <div id="securityRuleEval" class="rule-eval"></div>
        </div>
      </details>

      <details class="process-step" data-step="accumulation" open>
        <summary>
          <span class="process-step-num">3</span>
          <span class="process-step-title" data-i18n="common.pipeline.accumulation"></span>
        </summary>
        <div class="process-step-body">
          <p class="process-step-hint" data-i18n="common.pipeline.accumulationHintSugeno"></p>
          <div class="graph-grid graph-grid-split">
            <div class="membership-section membership-section-wide">
              <h4 data-i18n="security.membership.risk"></h4>
              <div id="riskMembership" class="membership-values"></div>
            </div>
          </div>
        </div>
      </details>

      <details class="process-step" data-step="defuzzification" open>
        <summary>
          <span class="process-step-num">4</span>
          <span class="process-step-title" data-i18n="common.pipeline.defuzzification"></span>
        </summary>
        <div class="process-step-body">
          <p class="process-step-hint" data-i18n="common.pipeline.defuzzificationHintSugeno"></p>
          <div class="graph-grid graph-grid-1">
            <div class="graph-container">
              <h4 data-i18n="security.membership.risk"></h4>
              <canvas id="riskCanvas" width="800" height="220"></canvas>
            </div>
          </div>
        </div>
      </details>

    </div>

    <script src="i18n-helper.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="controller-docs.js"></script>
    <script src="fuzzy-page-core.js"></script>
    <script src="security.js"></script>
  </body>
</html>
