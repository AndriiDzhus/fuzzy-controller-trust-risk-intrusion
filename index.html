<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuzzy Logic Security Risk Controller</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Security Risk Fuzzy Controller</h1>

      <div class="input-section">
        <label for="connectionStrength">Connection Strength (0-100):</label>
        <input
          type="number"
          id="connectionStrength"
          value="50"
          min="0"
          max="100"
          step="0.1"
        />

        <label for="responseTime">Response Time (0-100):</label>
        <input
          type="number"
          id="responseTime"
          value="50"
          min="0"
          max="100"
          step="0.1"
        />

        <label for="energyConsumption">Energy Consumption (0-100):</label>
        <input
          type="number"
          id="energyConsumption"
          value="50"
          min="0"
          max="100"
          step="0.1"
        />

        <button id="calculateBtn">Calculate Security Risk</button>
      </div>

      <div class="output-section">
        <h2>
          Calculated Security Risk: <span id="securityRiskOutput">--</span>
        </h2>
        <p>Most Active Output Term: <span id="activeOutputTerm">--</span></p>
      </div>

      <div class="graphs-section">
        <h3>Input Membership Functions</h3>
        <div class="graph-row">
          <div class="graph-container">
            <h4>Connection Strength</h4>
            <canvas
              id="connectionStrengthCanvas"
              width="300"
              height="200"
            ></canvas>
          </div>
          <div class="graph-container">
            <h4>Response Time</h4>
            <canvas id="responseTimeCanvas" width="300" height="200"></canvas>
          </div>
          <div class="graph-container">
            <h4>Energy Consumption</h4>
            <canvas
              id="energyConsumptionCanvas"
              width="300"
              height="200"
            ></canvas>
          </div>
        </div>

        <h3>Output Membership Function</h3>
        <div class="graph-container wide">
          <h4>Security Risk Level</h4>
          <canvas id="securityRiskCanvas" width="600" height="200"></canvas>
        </div>
      </div>
    </div>

    <!-- Include fuzzyIS library -->
    <!-- You would typically download fuzzy.js and include it locally -->
    <!-- For demonstration, assuming a direct link or local file -->
    <script src="https://unpkg.com/fuzzy.js@latest/dist/fuzzy.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
